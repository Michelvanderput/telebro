<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' https://image.tmdb.org https://*.archive.org https://archive.org data:">
<title>Telebro</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="side" class="drag">
    <div class="logo">Telebro</div>
    <nav id="nav">
      <button data-v="home" class="on"><span>⌂</span>Home</button>
      <button data-v="movies"><span>▭</span>Films</button>
      <button data-v="series"><span>☰</span>Series</button>
      <button data-v="discover"><span>⌕</span>Ontdekken</button>
      <button data-v="downloads"><span>↓</span>Downloads<i id="dlBadge" hidden></i></button>
      <button data-v="settings"><span>⚙</span>Instellingen</button>
    </nav>
    <div class="grow"></div>
    <label class="tvpick"><span>Afspelen op</span>
      <select id="device"><option value="">Tv zoeken…</option></select>
    </label>
  </aside>
  <div id="content">
    <header class="drag">
      <input id="search" type="search" placeholder="Zoeken  ( / )" autocomplete="off">
      <div class="grow"></div>
      <button id="rescan" title="Mappen opnieuw scannen">↻ Scannen</button>
    </header>
    <div id="view"></div>
  </div>
</div>
<footer id="bar" hidden>
  <img id="barPoster" alt="">
  <div class="barTitle"><b id="nowTitle"></b><small id="nowEp"></small></div>
  <button id="pp" title="Pauze / hervat (spatie)">❚❚</button>
  <span id="t0">0:00</span>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="t1">0:00</span>
  <select id="cc" title="Ondertiteling"></select>
  <button id="nextEp" title="Volgende aflevering" hidden>⏭</button>
  <input id="vol" type="range" min="0" max="100" value="50" title="Volume">
  <button id="stop" title="Stoppen">■</button>
</footer>
<div id="modal" hidden></div>
<div id="drop" hidden>Laat je .torrent-bestand of magnet-link hier los</div>
<div id="toast" hidden></div>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
